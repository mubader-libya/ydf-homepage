# إعداد الخادم المقترح لـ ydf.ly (Nginx). يُراجع ويُعتمد قبل التطبيق على الإنتاج.
# المبدأ: الملفات التي لا يتغير محتواها تحت نفس الاسم تُخزَّن سنة كاملة (immutable)،
# وصفحات HTML تُراجَع في كل زيارة (no-cache + ETag) حتى يظهر أي تحديث فوراً.

server {
    listen 443 ssl http2;
    server_name ydf.ly www.ydf.ly;
    root /var/www/ydf-site;

    # ضغط النصوص (Brotli إن توفرت الوحدة، وإلا gzip)
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    # brotli on; brotli_types text/css application/javascript application/json image/svg+xml;

    # الصور والخطوط: أسماؤها ثابتة لمحتوى ثابت (الصور تحمل بصمة في اسمها)
    location ~* ^/(img|fonts)/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # CSS و JS: تُطلب دائماً بـ ?v=<إصدار> من الصفحات، فتُخزَّن سنة.
    # عند أي تعديل: ارفع رقم الإصدار في الصفحات (deploy/bump-version.sh).
    location ~* \.(css|js)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # الإعداد الذي قد يتغير دون إصدار جديد (رابط Strapi)
    location = /site-config.js {
        add_header Cache-Control "no-cache";
    }

    # الصفحات: تُراجَع دائماً
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}

# Strapi على cms.ydf.ly: الوسائط المرفوعة لا تتغير تحت نفس الرابط
